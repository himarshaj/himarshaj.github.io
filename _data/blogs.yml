- title: "PDFServer - Our Summer Internship at LANL"
  date: 2022-12-21
  url: "https://ws-dl.blogspot.com/2022/12/2022-12-21-pdfserver-our-summer.html"
  venue: "WS-DL Blog"
  excerpt: "A recap of our 2022 summer internship at Los Alamos National Laboratory, where we developed PDFServer—a prototype to extract metadata, generate social cards, and robustify links from scientific PDF documents for LANL's RASSTI workflow."

- title: "Creation Time and Published Time Are Not the Same: Estimating the Instagram Epoch"
  date: 2021-02-20
  url: "https://ws-dl.blogspot.com/2021/02/2021-02-20-creation-time-and-published.html"
  venue: "WS-DL Blog"
  excerpt: "While studying how to extract published datetime from Instagram post URLs, we uncovered a discrepancy between the published time in HTML and the creation time embedded in the post shortcode, with implications for sorting events by Instagram publishing time."
  tags:
    - Instagram
    - Web Archiving
    - Social Media


- title: "Summer Project as a Google Summer of Code (GSoC) Contributor"
  date: 2025-09-29
  url: "https://ws-dl.blogspot.com/2025/09/2025-09-29-summer-project-as-google.html"
  venue: "WS-DL Blog"
  excerpt: "This summer (summer of 2025), I got the opportunity to be a Google Summer of Code (GSoC) contributor. I worked with the TV News Archive at the Internet Archive under the mentorship of Dr. Sawood Alam, focusing on detecting social media content in TV news through logo and post screenshot detection."
  tags:
    - GSoC
    - Internet Archive
    - TV News Archive

- title: "A Battle of Opinions: Tools vs. Humans (and Humans vs. Humans) in Sentiment Analysis"
  date: 2025-03-26
  url: "https://ws-dl.blogspot.com/2025/03/2025-03-26-battle-of-opinions-tools-vs_61.html"
  venue: "WS-DL Blog"
  excerpt: "We analyzed the sentiment of 100 tweets using three sentiment analysis tools (TextBlob, VADER, and a RoBERTa-base model) and six human raters, finding that consensus was hard to reach—even among humans—and that RoBERTa showed the best alignment with human ratings."
  tags:
    - Sentiment Analysis
    - Social Media
    - Machine Learning

- title: "Tools for Using the Internet Archive's TV News Archive as Research Data"
  date: 2024-08-07
  url: "https://ws-dl.blogspot.com/2024/08/2024-08-07-tools-for-using-internet.html"

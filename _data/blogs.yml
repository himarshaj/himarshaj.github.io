- title: "Twitter Added Labels On Its Old User Interface"
  date: 2020-12-08
  url: "https://ws-dl.blogspot.com/2020/12/2020-12-08-twitter-added-labels-on-its.html"
  venue: "WS-DL Blog"
  excerpt: "Twitter retroactively added warning labels to tweets on its old user interface, creating mismatches between what was originally archived and what users see when replaying older Twitter mementos."
  tags:
    - Twitter
    - Web Archiving
    - Social Media

- title: "How Well Is Instagram Archived?"
  date: 2020-11-04
  url: "https://ws-dl.blogspot.com/2020/11/2020-11-04-how-well-is-instagram.html"
  venue: "WS-DL Blog"
  excerpt: "Using Katy Perry's Instagram account as a case study, we found that only about one-third of her individual posts were archived in public web archives—far behind Twitter and Facebook—despite Instagram's massive user base."
  tags:
    - Instagram
    - Web Archiving
    - Mementos

- title: "New Twitter UI: Replaying Archived Twitter Pages That Never Existed"
  date: 2020-11-04
  url: "https://ws-dl.blogspot.com/2020/11/2020-11-04-new-twitter-ui-replaying.html"
  venue: "WS-DL Blog"
  excerpt: "Twitter's new user interface can cause archived Twitter pages to replay as layouts that never existed at crawl time, introducing further fidelity problems for web archive replay."
  tags:
    - Twitter
    - Web Archiving
    - Replay


<article class="blog-card">
  <a class="blog-card__link" href="{{ include.blog.url }}" target="_blank" rel="noopener" aria-label="Read {{ include.blog.title }} on {{ include.blog.venue }}">
    <div class="blog-card__header">
      <div class="blog-card__meta">
        <time datetime="{{ include.blog.date }}">{{ include.blog.date | date: "%B %d, %Y" }}</time>
        <span class="blog-card__venue"><i class="fab fa-blogger" aria-hidden="true"></i> {{ include.blog.venue }}</span>
      </div>
      <h3 class="blog-card__title">{{ include.blog.title }}</h3>
    </div>

    <div class="blog-card__body">
      <p class="blog-card__excerpt">{{ include.blog.excerpt }}</p>

      {% if include.blog.tags %}
        <ul class="blog-card__tags">
          {% for tag in include.blog.tags %}
            <li>{{ tag }}</li>
          {% endfor %}
        </ul>
      {% endif %}
    </div>

    <div class="blog-card__footer">
      <span class="blog-card__cta">Read full post <i class="fas fa-external-link-alt" aria-hidden="true"></i></span>
      <span class="blog-card__url">{{ include.blog.url | replace: 'https://', '' }}</span>
    </div>
  </a>
</article>

<div class="pub-icon-legend" role="note" aria-label="Publication link icons">
  <span class="pub-icon-legend__label">Icons:</span>
  <span class="pub-icon-legend__item">
    <i class="ai ai-fw ai-doi" style="color: {{ page.doi-color | default: '#fcab22' }}"></i>
    <span>DOI</span>
  </span>
  <span class="pub-icon-legend__item">
    <i class="ai ai-fw ai-arxiv"></i>
    <span>arXiv</span>
  </span>
  <span class="pub-icon-legend__item">
    <i class="fas fa-fw fa-book pub-icon--bibtex"></i>
    <span>BibTeX</span>
  </span>
  <span class="pub-icon-legend__item">
    <i class="fas fa-solid fa-file-pdf" style="color: {{ page.acrobat-color | default: '#f70e0c' }}"></i>
    <span>PDF</span>
  </span>
  <span class="pub-icon-legend__item">
    <i class="fas fa-fw fa-link"></i>
    <span>Link</span>
  </span>
</div>
